# Users: static `users` list or USERS env wins; otherwise top_users discovery (default).
# SM_REGION env appends sm-region:<value> to base_query.
# users: [tomaszs]
top_users:
  count: 20
  match: {"@msg": [SESSION_CONFIG]}
  refresh: 24h
user_facet: "@userid"
base_query: "sm-env:prod-rt service:proxy-service"
window: 10m
lag: 1m
interval: 10m       # collection period in -serve mode
weeks: 4
weekday_samples: 10   # Mon-Fri: also compare with the same time on recent weekdays
min_samples_mad: 6
mad_k: 3
gap: 4s

cache:
  type: disk          # memory | disk | postgres
  path: .cache
  # dsn: postgres://user:pass@host/db   (or CACHE_DSN env)

# All metrics go into one Datadog call per window: filter is the OR of all `match` blocks,
# grouped by user + match facets. Values are picked from matching buckets locally.
metrics:
  - name: session_config_count
    match: {"@msg": [SESSION_CONFIG]}
    aggregation: count
    low: 0.5
    high: 2.0
    min_value: 10

  - name: avg_session_duration
    match: {"@msg": [CONNECTION_CLOSED]}
    aggregation: avg
    measure: "@context.session_duration"
    low: 0.5
    high: 2.0

  - name: proxy_warn_error_count
    match: {status: [warn, error]}
    aggregation: count
    low: 0.5
    high: 2.0
    min_value: 10
    alert_if_no_history: true

  - name: median_final_lag_ms
    match: {"@msg": ["connection usage stats"]}
    aggregation: pc50
    measure: "@g.final_lag"
    low: 0.5
    high: 2.0
